<script>
    // Intercept fetch to automatically attach x-session-id header
    (function() {
        let sessionId = localStorage.getItem('wolfs_session_id');
        if (!sessionId) {
            sessionId = 'sess_' + Math.random().toString(36).substring(2, 15) + '_' + Date.now();
            localStorage.setItem('wolfs_session_id', sessionId);
        }

        const originalFetch = window.fetch;
        window.fetch = async function(resource, init) {
            init = init || {};
            init.headers = init.headers || {};
            if (init.headers instanceof Headers) {
                init.headers.set('x-session-id', sessionId);
            } else if (Array.isArray(init.headers)) {
                init.headers.push(['x-session-id', sessionId]);
            } else {
                init.headers['x-session-id'] = sessionId;
            }
            return originalFetch(resource, init);
        };
    })();

    // State management
    let time = 120; // Start with 2 minutes
    const display = document.getElementById('countdown');
    
    function isTimerActive() {
        if (!currentGameState) return false;
        
        // Timer active during chat rounds if it is the human player's turn
        if (currentGameState.status === "CHAT_ROUND_1" || currentGameState.status === "CHAT_ROUND_2") {
            const activePlayer = currentGameState.players.find(p => p.id === currentGameState.activePlayerId);
            return activePlayer && activePlayer.type === "HUMAN";
        }
        
        // Timer active during voting if the human hasn't voted yet
        if (currentGameState.status === "VOTING") {
            const humanPlayer = currentGameState.players.find(p => p.type === "HUMAN");
            const hasVoted = humanPlayer && currentGameState.votes && currentGameState.votes[humanPlayer.id];
            return !hasVoted;
        }
        
        return false;
    }

    async function handleTimeout() {
        try {
            console.warn("Operator timeout reached. Triggering terminal security shutdown...");
            const res = await fetch('/api/game/timeout', { method: 'POST' });
            if (res.ok) {
                await fetchGameState(); // Instantly sync state to show game over
            }
        } catch (err) {
            console.error("Error sending timeout signal:", err);
        }
    }
    
    // Countdown Timer
    setInterval(() => {
        if (!isTimerActive()) {
            if (time !== 120) {
                time = 120;
                display.textContent = "02:00";
            }
            return;
        }
        
        if (time <= 0) return;
        time--;
        const mins = Math.floor(time / 60);
        const secs = time % 60;
        display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        if (time === 0) {
            handleTimeout();
        }

    // Native Synth Audio System using Web Audio API
    function playSynthSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!audioCtx) return;

            if (type === 'vote') {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(950, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'beep') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.0, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'turn') {
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, now);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1760, now + 0.06);

                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start(now);
                osc1.stop(now + 0.06);
                osc2.start(now + 0.06);
                osc2.stop(now + 0.2);
            } else if (type === 'elimination') {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.6);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.05, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.4);
                });
            }
        } catch (e) {
            console.warn("Audio Context sound failed", e);
        }
    }

    // Toggle highlighted borders and active/inactive state classes on profiles

            const footerEl = document.getElementById(suspect.footerId);
            const labelEl = document.getElementById(suspect.labelId);
            const overlayEl = document.getElementById(suspect.overlayId);

            if (i === index) {
                // Set Active state classes
                cardEl.className = `group relative bg-surface-container-low transition-all cursor-pointer w-full ${suspect.activeClass}`;
                if (iconEl) iconEl.className = `material-symbols-outlined text-4xl ${suspect.iconActiveClass}`;
                if (footerEl) footerEl.className = `px-3 py-1 border-t ${suspect.footerActiveClass}`;
                if (labelEl) labelEl.className = `text-[11px] font-bold ${suspect.labelActiveClass}`;
                if (overlayEl) {
                    overlayEl.className = `absolute top-2 right-2 text-[8px] font-black uppercase px-1.5 py-0.5 border ${suspect.overlayClass} z-10 animate-pulse`;
                    overlayEl.classList.remove('hidden');
                }
            } else {
                // Set Inactive state classes
                cardEl.className = `group relative bg-surface-container-low transition-all cursor-pointer w-full ${suspect.inactiveClass}`;
                if (iconEl) iconEl.className = `material-symbols-outlined text-4xl ${suspect.iconInactiveClass}`;
                if (footerEl) footerEl.className = `px-3 py-1 border-t ${suspect.footerInactiveClass}`;
                if (labelEl) labelEl.className = `text-[11px] font-bold ${suspect.labelInactiveClass}`;
                if (overlayEl) {
                    overlayEl.classList.add('hidden');
                }
            }
        });

        // Dynamic Terminal Input Styling matching active speaker
        const formEl = document.getElementById('chat-form');
        const arrowEl = document.getElementById('chat-arrow');
        const inputEl = document.getElementById('chat-input');
        const cursorEl = document.getElementById('chat-cursor');

        if (formEl && arrowEl && inputEl && cursorEl) {
            // Reset focus-within border classes and text classes
            formEl.className = "flex items-center gap-4 bg-surface-container-low px-4 py-3 border border-white/5 group transition-colors duration-300";
            
            if (index === 0) {
                // Kaicheng (Neon Green)
                formEl.classList.add("focus-within:border-neon-green/50");
                arrowEl.className = "text-neon-green font-bold terminal-glow-green text-lg animate-pulse";
                inputEl.className = "flex-1 bg-transparent border-none text-neon-green text-[14px] focus:ring-0 placeholder:text-neon-green/20 uppercase tracking-wider p-0 font-bold transition-colors duration-300";
                cursorEl.className = "w-1.5 h-5 bg-neon-green shadow-[0_0_8px_rgba(0,255,65,1)] transition-all duration-300";
            } else if (index === 1) {
                // Hairen (Electric Blue)
                formEl.classList.add("focus-within:border-electric-blue/50");
                arrowEl.className = "text-electric-blue font-bold terminal-glow-blue text-lg animate-pulse";
                inputEl.className = "flex-1 bg-transparent border-none text-electric-blue text-[14px] focus:ring-0 placeholder:text-electric-blue/20 uppercase tracking-wider p-0 font-bold transition-colors duration-300";
                cursorEl.className = "w-1.5 h-5 bg-electric-blue shadow-[0_0_8px_rgba(0,209,255,1)] transition-all duration-300";
            } else if (index === 2) {
                // Sherrai (Hot Pink)
                formEl.classList.add("focus-within:border-hot-pink/50");
                arrowEl.className = "text-hot-pink font-bold terminal-glow-pink text-lg animate-pulse";
                inputEl.className = "flex-1 bg-transparent border-none text-hot-pink text-[14px] focus:ring-0 placeholder:text-hot-pink/20 uppercase tracking-wider p-0 font-bold transition-colors duration-300";
                cursorEl.className = "w-1.5 h-5 bg-hot-pink shadow-[0_0_8px_rgba(255,0,122,1)] transition-all duration-300";
            } else if (index === 3) {
                // Kaizuki (Amber)
                formEl.classList.add("focus-within:border-amber/50");
                arrowEl.className = "text-amber font-bold terminal-glow-amber text-lg animate-pulse";
                inputEl.className = "flex-1 bg-transparent border-none text-amber text-[14px] focus:ring-0 placeholder:text-amber/20 uppercase tracking-wider p-0 font-bold transition-colors duration-300";
                cursorEl.className = "w-1.5 h-5 bg-amber shadow-[0_0_8px_rgba(255,184,0,1)] transition-all duration-300";
            } else if (index === -1) {
                // Operator (White / Gray neutral glow)
                formEl.classList.add("focus-within:border-white/30");
                arrowEl.className = "text-white font-bold text-lg animate-pulse";
                inputEl.className = "flex-1 bg-transparent border-none text-white text-[14px] focus:ring-0 placeholder:text-white/20 uppercase tracking-wider p-0 font-bold transition-colors duration-300";
                cursorEl.className = "w-1.5 h-5 bg-white shadow-[0_0_8px_rgba(255,255,255,0.8)] transition-all duration-300";
            }
        }
    }

    // Backend REST Sync Integration
    let currentGameState = null;
    let lastStatus = null;
    let lastRound = null;
    let lastActivePlayerId = null;
    let renderedMessageCount = 0;
    let isRequestingStep = false;
    let isSteppingVotes = false;

    async function fetchGameState() {
        try {
            const res = await fetch('/api/game/state');
            const state = await res.json();
            
            if (state.status === "LOBBY") {
                // Trigger auto-setup
                const setupRes = await fetch('/api/game/setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerName: "TOTALLY_AI (YOU)" })
                });
                const setupData = await setupRes.json();
                if (setupData.success) {
                    await fetchGameState();
                }
            } else {
                updateUI(state);
            }
        } catch (err) {
            console.error("Error fetching game state:", err);
        }
    }

    function updateUI(state) {
        currentGameState = state;
        
        // Reset count if server messages have been cleared or reset
        if (state.messages.length < renderedMessageCount) {
            document.getElementById('chat-container').innerHTML = '';
            renderedMessageCount = 0;
        }

        // Update the top-left status bar dynamically
        const headerText = `PROJECT_TURIN // KERNEL STATUS: ${state.status} // ROUND ${state.round}`;
        const headerEl = document.querySelector('header span.terminal-glow-green');
        if (headerEl) {
            headerEl.textContent = headerText;
        }

        // 1. Render Subject Cards Status (Eliminated or Active)
        const humanPlayer = state.players.find(p => p.type === "HUMAN");
        const hasVoted = humanPlayer && state.votes && state.votes[humanPlayer.id];
        const votedTargetId = hasVoted ? state.votes[humanPlayer.id].targetId : null;

        suspects.forEach((suspect, index) => {
            const playerInState = state.players.find(p => p.name === suspect.name);
            const cardEl = document.getElementById(suspect.id);
            const labelEl = document.getElementById(suspect.labelId);
            const buttonEl = cardEl.querySelector('button');

            if (playerInState) {
                if (playerInState.isEliminated) {
                    cardEl.style.opacity = "0.2";
                    cardEl.style.pointerEvents = "none";
                    if (labelEl) labelEl.textContent = "DE-COUPLED";
                    if (buttonEl) buttonEl.style.display = "none";
                } else {
                    cardEl.style.opacity = "1";
                    cardEl.style.pointerEvents = "auto";
                    if (labelEl) labelEl.textContent = suspect.name;
                    
                    if (buttonEl) {
                        if (state.status === "VOTING") {
                            buttonEl.style.display = "inline-block";
                            if (hasVoted) {
                                buttonEl.disabled = true;
                                if (playerInState.id === votedTargetId) {
                                    buttonEl.textContent = "VOTED";
                                    buttonEl.className = "border border-error bg-error text-black rounded-sm px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider pointer-events-none";
                                } else {
                                    // Check if this AI has already voted
                                    const aiVoted = state.votes && state.votes[playerInState.id];
                                    const activeLLMs = state.players.filter(p => p.type === "LLM" && !p.isEliminated);
                                    const nextVotingLlm = activeLLMs.find(llm => !state.votes[llm.id]);

                                    if (aiVoted) {
                                        buttonEl.textContent = "VOTED";
                                        buttonEl.className = "border border-neon-green/30 text-neon-green/80 bg-neon-green/5 rounded-sm px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider pointer-events-none opacity-80";
                                    } else if (nextVotingLlm && playerInState.id === nextVotingLlm.id) {
                                        buttonEl.textContent = "VOTING...";
                                        buttonEl.className = "border border-amber/50 text-amber bg-amber/5 rounded-sm px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider pointer-events-none animate-pulse";
                                    } else {
                                        buttonEl.textContent = "QUEUED";
                                        buttonEl.className = "border border-white/5 text-white/20 bg-transparent rounded-sm px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider pointer-events-none opacity-30";
                                    }
                                }
                            } else {
                                buttonEl.disabled = false;
                                buttonEl.textContent = "VOTE";
                                buttonEl.className = "border border-error/50 text-error bg-error/5 hover:bg-error hover:text-black hover:border-error transition-all rounded-sm px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider cursor-pointer animate-pulse";
                            }
                        } else {
                            buttonEl.style.display = "none";
                        }
                    }
                }
            }
        });

        // 2. Append new messages incrementally
        const chatContainer = document.getElementById('chat-container');
        
        // If chat is completely empty, insert a gorgeous system intro
        if (renderedMessageCount === 0 && state.messages.length > 0) {
            const introDiv = document.createElement('div');
            introDiv.className = 'space-y-2 max-w-2xl mb-6';
            introDiv.innerHTML = `
                <div class="text-neon-green/40 text-[11px] font-bold tracking-widest uppercase">SYSTEM_INITIALIZATION</div>
                <div class="pl-4 border-l-2 border-neon-green/20 text-neon-green/80 leading-relaxed uppercase text-[12px]">
                    DISCUSSION TOPIC INJECTED:<br>
                    <span class="text-white font-bold">"${state.topic}"</span>
                </div>
            `;
            chatContainer.appendChild(introDiv);
        }

        if (state.messages.length > renderedMessageCount) {
            const newMessages = state.messages.slice(renderedMessageCount);
            newMessages.forEach(msg => {
                const playerInState = state.players.find(p => p.id === msg.playerId);
                const isLlm = playerInState ? playerInState.type === "LLM" : true;
                
                const msgDiv = document.createElement('div');
                msgDiv.className = 'space-y-2 max-w-3xl mb-6';
                
                if (isLlm) {
                    const suspect = suspects.find(s => s.name === msg.senderName);
                    if (suspect) {
                        msgDiv.innerHTML = `
                            <div class="flex items-center gap-2 ${suspect.colorClass} text-[11px] font-bold tracking-widest uppercase">
                                <span class="material-symbols-outlined text-[14px]">${suspect.icon}</span> ${suspect.name}
                            </div>
                            <div class="pl-4 border-l-2 ${suspect.borderColorClass} ${suspect.colorClass} ${suspect.glowClass} leading-relaxed text-[13px]">
                                ${msg.text}
                            </div>
                        `;
                    } else {
                        msgDiv.innerHTML = `
                            <div class="flex items-center gap-2 text-primary text-[11px] font-bold tracking-widest uppercase">
                                <span class="material-symbols-outlined text-[14px]">smart_toy</span> ${msg.senderName}
                            </div>
                            <div class="pl-4 border-l-2 border-primary text-primary leading-relaxed text-[13px]">
                                ${msg.text}
                            </div>
                        `;
                    }
                } else {
                    msgDiv.innerHTML = `
                        <div class="text-white/40 text-[11px] font-bold tracking-widest uppercase">OPERATOR [${msg.senderName}]</div>
                        <div class="pl-4 border-l-2 border-white/20 text-white/80 leading-relaxed uppercase text-[13px]">
                            ${msg.text}
                        </div>
                    `;
                }
                chatContainer.appendChild(msgDiv);
                playSynthSound('beep');
            });
            renderedMessageCount = state.messages.length;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Clean any residual panels or indicators
        const existingTyping = document.getElementById('typing-indicator');
        let preserveTyping = false;
        
        if (state.status === "CHAT_ROUND_1" || state.status === "CHAT_ROUND_2") {
            const activePlayer = state.players.find(p => p.id === state.activePlayerId);
            if (activePlayer && activePlayer.type !== "HUMAN") {
                if (existingTyping && existingTyping.getAttribute('data-player-id') === activePlayer.id) {
                    preserveTyping = true;
                }
            }
        }
        
        if (existingTyping && !preserveTyping) {
            existingTyping.remove();
        }
        
        const existingReveal = document.getElementById('reveal-panel');
        if (existingReveal) existingReveal.remove();

        const existingGameOver = document.getElementById('gameover-panel');
        if (existingGameOver) existingGameOver.remove();

        // 3. Update Input, Blinker state and handle Auto-Stepping
        const inputEl = document.getElementById('chat-input');
        
        if (state.status === "CHAT_ROUND_1" || state.status === "CHAT_ROUND_2") {
            const activePlayer = state.players.find(p => p.id === state.activePlayerId);
            if (activePlayer) {
                if (activePlayer.type === "HUMAN") {
                    setActiveSpeaker(-1);
                    inputEl.removeAttribute('disabled');
                    inputEl.placeholder = "YOUR TURN. ENTER COMPILATION QUERY...";
                    
                    if (lastStatus !== state.status || lastRound !== state.round || activePlayer.id !== lastActivePlayerId) {
                        playSynthSound('turn');
                    }
                } else {
                    const activeSuspectIndex = suspects.findIndex(s => s.name === activePlayer.name);
                    if (activeSuspectIndex !== -1) {
                        setActiveSpeaker(activeSuspectIndex);
                    }
                    
                    inputEl.setAttribute('disabled', 'true');
                    inputEl.placeholder = `SUBJECT ${activePlayer.name} IS ANALYZING SYSTEM PARAMETERS...`;
                    
                    const suspect = suspects[activeSuspectIndex];
                    if (suspect && !preserveTyping) {
                        const typingDiv = document.createElement('div');
                        typingDiv.id = 'typing-indicator';
                        typingDiv.setAttribute('data-player-id', activePlayer.id);
                        typingDiv.className = 'space-y-2 max-w-3xl mb-6';
                        typingDiv.innerHTML = `
                            <div class="flex items-center gap-2 ${suspect.colorClass} text-[11px] font-bold tracking-widest uppercase animate-pulse">
                                <span class="material-symbols-outlined text-[14px] animate-spin">${suspect.icon}</span> ${suspect.name}
                            </div>
                            <div class="pl-4 border-l-2 ${suspect.borderColorClass} flex flex-col md:flex-row md:items-center gap-6 py-2">
                                <!-- Visual Waveform Lines -->
                                <div class="flex items-end gap-1 h-6 shrink-0">
                                    <div class="w-[3px] bg-current ${suspect.colorClass} wave-bar" style="height: 100%; animation-delay: 0.1s;"></div>
                                    <div class="w-[3px] bg-current ${suspect.colorClass} wave-bar" style="height: 60%; animation-delay: 0.3s;"></div>
                                    <div class="w-[3px] bg-current ${suspect.colorClass} wave-bar" style="height: 80%; animation-delay: 0.5s;"></div>
                                    <div class="w-[3px] bg-current ${suspect.colorClass} wave-bar" style="height: 40%; animation-delay: 0.2s;"></div>
                                    <div class="w-[3px] bg-current ${suspect.colorClass} wave-bar" style="height: 70%; animation-delay: 0.4s;"></div>
                                    <div class="w-[3px] bg-current ${suspect.colorClass} wave-bar" style="height: 90%; animation-delay: 0.6s;"></div>
                                </div>
                                
                                <!-- Retro Logs block -->
                                <div class="${suspect.colorClass} space-y-1 text-[11px] font-mono opacity-80 leading-relaxed uppercase">
                                    <div class="flex items-center gap-2">
                                        <span class="animate-pulse">▶</span> <span id="typing-subroutine-log">COMPILING CONTEXT VECTORS...</span>
                                    </div>
                                    <div class="text-[10px] text-white/50 tracking-wider">
                                        THINK_UPTIME: <span id="uptime-count">0.5</span>s [■■■■■■■░░░] 70%
                                    </div>
                                </div>
                            </div>
                        `;
                        chatContainer.appendChild(typingDiv);
                        chatContainer.scrollTop = chatContainer.scrollHeight;

                        // Subroutine typing rotation effect
                        let subIndex = 0;
                        const subroutines = [
                            "FETCHING COMPILER INSTRUCTIONS...",
                            "RETRIEVING DISCUSSION LOGIC HISTORY...",
                            "RESOLVING CONTEXT WORD MAP VECTOR...",
                            "COMPILING SYSTEM DIALOGUE OUTPUTS..."
                        ];
                        
                        const consoleInterval = setInterval(() => {
                            const currentIndicator = document.getElementById('typing-indicator');
                            
                            // If typing-indicator is no longer in DOM or belongs to another player, clean up!
                            if (!currentIndicator || currentIndicator.getAttribute('data-player-id') !== activePlayer.id) {
                                clearInterval(consoleInterval);
                                return;
                            }
                            
                            const logEl = currentIndicator.querySelector('#typing-subroutine-log');
                            const uptimeEl = currentIndicator.querySelector('#uptime-count');
                            
                            if (logEl) {
                                subIndex = (subIndex + 1) % subroutines.length;
                                logEl.textContent = subroutines[subIndex];
                            }
                            if (uptimeEl) {
                                let currentUptime = parseFloat(uptimeEl.textContent);
                                uptimeEl.textContent = (currentUptime + 0.4).toFixed(1);
                            }
                        }, 1000);
                    }

                    triggerLlmStep();
                }
            }
        } else if (state.status === "VOTING") {
            setActiveSpeaker(-1);
            inputEl.setAttribute('disabled', 'true');
            if (hasVoted) {
                const activeLLMs = state.players.filter(p => p.type === "LLM" && !p.isEliminated);
                const nextVotingLlm = activeLLMs.find(llm => !state.votes[llm.id]);
                if (nextVotingLlm) {
                    inputEl.placeholder = `SUBJECT ${nextVotingLlm.name} IS EXECUTING VOTE COMPILATION...`;
                } else {
                    inputEl.placeholder = "ALL VOTES CAST. AGGREGATING RESULTS...";
                }
            } else {
                inputEl.placeholder = "DECIPHER THREAT CONFORMS. CAST YOUR VOTE ABOVE...";
            }
        } else if (state.status === "REVEAL") {
            setActiveSpeaker(-1);
            inputEl.setAttribute('disabled', 'true');
            inputEl.placeholder = "ELIMINATION PROTOCOL ACTIVE...";
            
            const eliminatedPlayer = state.players.find(p => p.id === state.eliminatedId);
            if (eliminatedPlayer) {
                const revealDiv = document.createElement('div');
                revealDiv.id = 'reveal-panel';
                revealDiv.className = 'space-y-2 max-w-2xl mb-6 p-4 border border-error bg-error/5';
                
                revealDiv.innerHTML = `
                    <div class="text-error text-[11px] font-bold tracking-widest uppercase">AUDIT_DE_COUPLING_COMPLETED</div>
                    <div class="pl-4 border-l-2 border-error text-error/80 leading-relaxed uppercase text-[12px] mt-2">
                        ELIMINATION PROTOCOL INITIATED.<br>
                        SUBJECT ELIMINATED: <span class="font-bold underline text-white">${eliminatedPlayer.name}</span> (${eliminatedPlayer.type === 'HUMAN' ? 'HUMAN OPERATOR' : 'AI VILLAGER'})<br>
                        STATUS: PERMANENTLY DE-COUPLED FROM CLUSTER
                    </div>
                    <div class="mt-4 pt-2">
                        <button onclick="continueAfterReveal()" class="border border-neon-green/30 text-neon-green/80 bg-neon-green/5 hover:bg-neon-green hover:text-black hover:border-neon-green transition-all rounded-sm px-4 py-1.5 text-xs font-bold uppercase tracking-wider cursor-pointer">
                            CONTINUE_TO_NEXT_ROUND
                        </button>
                    </div>
                `;
                chatContainer.appendChild(revealDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                if (lastStatus !== "REVEAL") {
                    playSynthSound('elimination');
                }
            }
        } else if (state.status === "GAME_OVER") {
            setActiveSpeaker(-1);
            inputEl.setAttribute('disabled', 'true');
            inputEl.placeholder = "SYSTEM OFFLINE. KERNEL HALTED.";

            const isWin = state.winner === 'HUMAN';
            if (isWin) {
                window.location.href = '/result.html?status=win';
            } else {
                const human = state.players.find(p => p.type === 'HUMAN');
                const humanId = human ? human.id : 'P5';
                const reasons = [];
                if (state.votes) {
                    Object.entries(state.votes).forEach(([voterId, voteObj]) => {
                        if (voteObj.targetId === humanId && voteObj.reasoning) {
                            const voter = state.players.find(p => p.id === voterId);
                            const voterName = voter ? voter.name : voterId;
                            reasons.push(`${voterName}: ${voteObj.reasoning}`);
                        }
                    });
                }
                const reasoningText = reasons.join('\n\n');
                sessionStorage.setItem('decoupling_reasoning', reasoningText);
                window.location.href = '/result.html?status=loss';
            }
            return;
        }

        // 4. Sequential Voting Stepping Loop
        if (state.status === "VOTING" && hasVoted) {
            const activeLLMs = state.players.filter(p => p.type === "LLM" && !p.isEliminated);
            const nextVotingLlm = activeLLMs.find(llm => !state.votes[llm.id]);
            
            if (nextVotingLlm) {
                if (!isSteppingVotes) {
                    isSteppingVotes = true;
                    setTimeout(async () => {
                        try {
                            const res = await fetch('/api/game/step-llm-votes', { method: 'POST' });
                            const data = await res.json();
                            if (data.success) {
                                await fetchGameState();
                            }
                        } catch (err) {
                            console.error("Error stepping LLM vote:", err);
                        } finally {
                            isSteppingVotes = false;
                        }
                    }, 2000); // 2 second pacing delay
                }
            } else {
                // All active LLMs have voted, but the server status is still "VOTING".
                // Trigger the final step-llm-votes call to aggregate, eliminate, and transition.
                if (!isSteppingVotes) {
                    isSteppingVotes = true;
                    setTimeout(async () => {
                        try {
                            const res = await fetch('/api/game/step-llm-votes', { method: 'POST' });
                            const data = await res.json();
                            if (data.success) {
                                await fetchGameState();
                            }
                        } catch (err) {
                            console.error("Error finalizing votes:", err);
                        } finally {
                            isSteppingVotes = false;
                        }
                    }, 1500);
                }
            }
        }

        lastStatus = state.status;
        lastRound = state.round;
        lastActivePlayerId = state.activePlayerId;
    }

    function triggerLlmStep() {
        if (isRequestingStep) return;
        isRequestingStep = true;
        
        setTimeout(async () => {
            try {
                const res = await fetch('/api/game/step-llm', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    await fetchGameState();
                }
            } catch (err) {
                console.error("Error stepping LLM:", err);
            } finally {
                isRequestingStep = false;
            }
        }, 1500);
    }

    async function submitQuery() {
        const inputEl = document.getElementById('chat-input');
        const query = inputEl.value.trim();
        if (!query) return;

        inputEl.value = '';
        
        try {
            inputEl.setAttribute('disabled', 'true');
            const res = await fetch('/api/game/message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: query })
            });
            const data = await res.json();
            if (data.success) {
                await fetchGameState();
            } else {
                alert("Error sending message: " + data.error);
            }
        } catch (err) {
            console.error("Error submitting query:", err);
        } finally {
            inputEl.removeAttribute('disabled');
            inputEl.focus();
        }
    }

    async function voteForSubject(index) {
        if (!currentGameState) return;
        const humanPlayer = currentGameState.players.find(p => p.type === "HUMAN");
        if (humanPlayer && currentGameState.votes && currentGameState.votes[humanPlayer.id]) {
            alert("Vote already registered. De-coupling protocol locked.");
            return;
        }

        const suspect = suspects[index];
        const playerInState = currentGameState.players.find(p => p.name === suspect.name);
        if (!playerInState) return;

        // Immediately disable all vote buttons on the UI to prevent double-clicks
        const allButtons = document.querySelectorAll('button');
        allButtons.forEach(btn => {
            if (btn.textContent === 'VOTE' || btn.textContent === 'VOTING') {
                btn.disabled = true;
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.3';
            }
        });
        
        const reasoning = "Suspicious behavioral latency mismatch.";
        
        try {
            const res = await fetch('/api/game/submit-vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetId: playerInState.id, reasoning: reasoning })
            });
            const data = await res.json();
            if (data.success) {
                playSynthSound('vote');
                // Update local state immediately and update UI
                if (!currentGameState.votes) currentGameState.votes = {};
                currentGameState.votes[humanPlayer.id] = { targetId: playerInState.id, reasoning: reasoning };
                updateUI(currentGameState);
            } else {
                alert("Vote submission failed: " + data.error);
                await fetchGameState(); // Sync and reset UI
            }
        } catch (err) {
            console.error("Error voting:", err);
            await fetchGameState(); // Sync and reset UI
        }
    }

    async function stepLlmVotes() {
        try {
            const res = await fetch('/api/game/step-llm-votes', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                await fetchGameState();
            }
        } catch (err) {
            console.error("Error stepping LLM votes:", err);
        }
    }

    async function continueAfterReveal() {
        try {
            const res = await fetch('/api/game/continue', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                await fetchGameState();
            }
        } catch (err) {
            console.error("Error continuing game:", err);
        }
    }

    async function resetGame() {
        try {
            const res = await fetch('/api/game/reset', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                window.location.reload();
            }
        } catch (err) {
            console.error("Error resetting game:", err);
        }
    }

    // Initialize state on page load and begin polling
    document.addEventListener('DOMContentLoaded', () => {
        fetchGameState();
        setInterval(fetchGameState, 1500);
    });
</script>
</body></html>

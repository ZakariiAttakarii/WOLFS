<script>
    async function hardResetGame() {
        if (confirm("Are you sure you want to HARD RESET everything?\nThis will clear all game state and session history, and return you to the main lobby.")) {
            try {
                const sessionId = localStorage.getItem('wolfs_session_id');
                if (sessionId) {
                    await fetch('/api/game/reset', {
                        method: 'POST',
                        headers: { 'x-session-id': sessionId }
                    });
                }
            } catch (e) {
                console.error("Failed to reset game session on server:", e);
            }
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Simple clock for the status bar
        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const clockEl = document.getElementById('clock');
            if (clockEl) clockEl.textContent = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Mouse hover interactions for terminal lines
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                // Subtle terminal glitch sound effect would go here
                console.log("Terminal_Interaction: Focus_Gained");
            });
        });
    });
</script>

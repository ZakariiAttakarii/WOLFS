<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>PROJECT_TURIN // Diagnostics Result</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;family=Sora:wght@400;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <style>
        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.4; }
        }
        .flicker-animation { animation: flicker 3s infinite; }
        
        .scanline {
            background: linear-gradient(to bottom, rgba(0, 255, 65, 0) 50%, rgba(0, 255, 65, 0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        .pixel-grid {
            background-image: radial-gradient(#00FF41 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            opacity: 0.05;
        }

        .terminal-glow-green { text-shadow: 0 0 20px rgba(0, 255, 65, 0.8); }
        .terminal-glow-red { text-shadow: 0 0 20px rgba(255, 51, 51, 0.8); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0c0e12; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 65, 0.3); }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            background-color: #0c0e12;
            font-family: 'JetBrains Mono', monospace;
            transition: background-color 0.5s ease;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "surface": "#111318",
                "surface-container-low": "#1a1c20",
                "surface-container": "#1e2024",
                "background": "#0c0e12",
                "primary": "#00f0ff",
                "neon-green": "#00FF41",
                "electric-blue": "#00D1FF",
                "hot-pink": "#FF007A",
                "amber": "#FFB800",
                "error": "#ff3333",
                "on-surface": "#e2e2e8"
              }
            }
          }
        }
    </script>
</head>
<body class="selection:bg-neon-green selection:text-black min-h-screen flex flex-col justify-between relative overflow-hidden" id="body-el">

    <!-- Top-Right Hard Reset Button -->
    <div class="absolute top-6 right-6 z-50 flex items-center gap-4">
        <button onclick="hardResetGame()" class="border border-red-500/50 hover:border-red-500 bg-red-500/10 hover:bg-red-500/30 text-red-500 px-3 py-1 text-xs font-bold uppercase tracking-widest transition-all active:translate-y-0.5 flex items-center gap-1.5 cursor-pointer z-50">
            <span class="material-symbols-outlined text-sm">restart_alt</span>
            HARD_RESET
        </button>
    </div>

    <!-- Pixel Grid and Scanline Overlays -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="pixel-grid absolute inset-0" id="pixel-grid-el"></div>
        <div class="scanline absolute inset-0" id="scanline-el"></div>
        
        <!-- HUD Corners -->
        <div class="absolute top-4 left-4 w-8 h-8 border-t border-l border-white/20 transition-all duration-500" id="corner-tl"></div>
        <div class="absolute top-4 right-4 w-8 h-8 border-t border-r border-white/20 transition-all duration-500" id="corner-tr"></div>
        <div class="absolute bottom-4 left-4 w-8 h-8 border-b border-l border-white/20 transition-all duration-500" id="corner-bl"></div>
        <div class="absolute bottom-4 right-4 w-8 h-8 border-b border-r border-white/20 transition-all duration-500" id="corner-br"></div>
    </div>

    <!-- Main Content Area -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center p-4 max-w-4xl mx-auto w-full">
        
        <!-- Center Text, Ring & Glow Container -->
        <div class="relative mb-12 flex items-center justify-center min-h-[380px] w-full">
            <!-- Dynamic ambient glow sphere -->
            <div id="glow-sphere" class="absolute inset-0 bg-neon-green/10 blur-[120px] rounded-full transition-all duration-500 w-80 h-80 mx-auto"></div>
            
            <!-- Rotating futuristic decorative border -->
            <div id="border-ring-1" class="absolute border border-neon-green/20 rounded-full animate-[spin_20s_linear_infinite] transition-all duration-500 w-80 h-80"></div>
            <div id="border-ring-2" class="absolute border border-dashed border-neon-green/10 rounded-full animate-[spin_30s_linear_infinite_reverse] transition-all duration-500 w-[360px] h-[360px]"></div>
            
            <!-- Centered Result Title -->
            <h1 id="title" class="text-4xl md:text-6xl font-extrabold tracking-widest text-white uppercase terminal-glow-green transition-all duration-500 leading-none z-10 text-center select-none">
                YOU WON
            </h1>
        </div>

        <!-- Decoupling Reasoning Container for LLM votes (shown on loss) -->
        <div id="reasoning-box" class="hidden w-full max-w-xl bg-red-950/10 border border-error/20 p-5 mb-8 z-10 max-h-48 overflow-y-auto">
            <div class="text-[10px] text-error/50 uppercase tracking-widest mb-3 font-bold border-b border-error/10 pb-1.5 flex justify-between">
                <span>SYSTEM_AUDIT_LOG // DECOUPLING_REASONING</span>
                <span class="animate-pulse">DECRYPTION_SUCCESS</span>
            </div>
            <div id="reasoning-text" class="text-[11px] md:text-xs text-error/85 font-mono leading-relaxed space-y-3 whitespace-pre-line uppercase"></div>
        </div>

        <!-- Navigation Action Buttons -->
        <div class="flex justify-center w-full max-w-sm z-10">
            <button onclick="replayGame()" id="btn-replay" class="w-full border border-neon-green bg-neon-green text-black hover:bg-transparent hover:text-neon-green font-bold uppercase transition-all py-4 text-xs tracking-widest text-center cursor-pointer">
                BACK TO GAMEPLAY
            </button>
        </div>

    </main>

    <!-- Interactive Scripts for State Toggle & Synth Audio Tones -->
    <script>
        const states = {
            win: {
                themeColor: '#00FF41',
                bodyBg: '#0c0e12',
                pixelColor: '#00FF41',
                glowSphereClass: 'absolute inset-0 bg-neon-green/10 blur-[120px] rounded-full transition-all duration-500 w-80 h-80 mx-auto',
                ring1Class: 'absolute border border-neon-green/20 rounded-full animate-[spin_20s_linear_infinite] transition-all duration-500 w-80 h-80',
                ring2Class: 'absolute border border-dashed border-neon-green/10 rounded-full animate-[spin_30s_linear_infinite_reverse] transition-all duration-500 w-[360px] h-[360px]',
                title: 'YOU WON',
                titleClass: 'text-4xl md:text-6xl font-extrabold tracking-widest text-white uppercase terminal-glow-green transition-all duration-500 leading-none z-10 text-center select-none',
                btnReplayClass: 'w-full border border-neon-green bg-neon-green text-black hover:bg-transparent hover:text-neon-green font-bold uppercase transition-all py-4 text-xs tracking-widest text-center cursor-pointer'
            },
            loss: {
                themeColor: '#ff3333',
                bodyBg: '#120202',
                pixelColor: '#ff3333',
                glowSphereClass: 'absolute inset-0 bg-error/10 blur-[120px] rounded-full transition-all duration-500 w-80 h-80 mx-auto',
                ring1Class: 'absolute border border-error/20 rounded-full animate-[spin_20s_linear_infinite] transition-all duration-500 w-80 h-80',
                ring2Class: 'absolute border border-dashed border-error/10 rounded-full animate-[spin_30s_linear_infinite_reverse] transition-all duration-500 w-[360px] h-[360px]',
                title: 'YOU LOST',
                titleClass: 'text-4xl md:text-6xl font-extrabold tracking-widest text-white uppercase terminal-glow-red transition-all duration-500 leading-none z-10 text-center select-none',
                btnReplayClass: 'w-full border border-error bg-error text-black hover:bg-transparent hover:text-error font-bold uppercase transition-all py-4 text-xs tracking-widest text-center cursor-pointer'
            }
        };

        let currentActiveState = 'win';

        // Play synthetic tone using native AudioContext
        function playSynthTone(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                masterGain.connect(audioCtx.destination);

                if (type === 'win') {
                    // Ascending triumphant synth sweep
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc1.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.4);
                    
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.4);
                    
                    osc1.connect(masterGain);
                    osc2.connect(masterGain);
                    
                    osc1.start();
                    osc2.start();
                    osc1.stop(audioCtx.currentTime + 0.45);
                    osc2.stop(audioCtx.currentTime + 0.45);
                } else {
                    // Descending warning alarms & buzz
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    
                    osc1.type = 'sawtooth';
                    osc1.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc1.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.5);
                    
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(90, audioCtx.currentTime);
                    osc2.frequency.linearRampToValueAtTime(45, audioCtx.currentTime + 0.5);
                    
                    osc1.connect(masterGain);
                    osc2.connect(masterGain);
                    
                    osc1.start();
                    osc2.start();
                    osc1.stop(audioCtx.currentTime + 0.55);
                    osc2.stop(audioCtx.currentTime + 0.55);
                }
            } catch(e) {}
        }

        function setUIState(stateKey) {
            currentActiveState = stateKey;
            const state = states[stateKey];
            
            // Play Synth Tone
            playSynthTone(stateKey);

            // Update DOM Elements
            document.getElementById('body-el').style.backgroundColor = state.bodyBg;
            
            if (stateKey === 'win') {
                document.body.className = "selection:bg-neon-green selection:text-black min-h-screen flex flex-col justify-between relative overflow-hidden";
            } else {
                document.body.className = "selection:bg-error selection:text-black min-h-screen flex flex-col justify-between relative overflow-hidden";
            }

            // Update ambient ring styles and colors
            document.getElementById('pixel-grid-el').style.backgroundImage = `radial-gradient(${state.themeColor} 0.5px, transparent 0.5px)`;
            document.getElementById('scanline-el').style.background = `linear-gradient(to bottom, ${state.themeColor}00 50%, ${state.themeColor}0d 50%)`;
            document.getElementById('scanline-el').style.backgroundSize = '100% 4px';
            
            // HUD Corners border coloring
            ['corner-tl', 'corner-tr', 'corner-bl', 'corner-br'].forEach(id => {
                const corner = document.getElementById(id);
                corner.className = `absolute transition-all duration-500 ${id.includes('top') ? 'top-4' : 'bottom-4'} ${id.includes('left') ? 'left-4' : 'right-4'} w-8 h-8 border-${id.includes('top') ? 't' : 'b'} border-${id.includes('left') ? 'l' : 'r'} ${stateKey === 'win' ? 'border-neon-green/20' : 'border-error/20'}`;
            });

            // Middle elements
            document.getElementById('glow-sphere').className = state.glowSphereClass;
            document.getElementById('border-ring-1').className = state.ring1Class;
            document.getElementById('border-ring-2').className = state.ring2Class;
            
            // Titles
            const titleEl = document.getElementById('title');
            titleEl.textContent = state.title;
            titleEl.className = state.titleClass;

            // Replay Button
            const btnReplay = document.getElementById('btn-replay');
            btnReplay.className = state.btnReplayClass;

            // Dynamic Reasoning Box population
            const reasoningBox = document.getElementById('reasoning-box');
            const reasoningText = document.getElementById('reasoning-text');
            if (stateKey === 'loss') {
                const reasoning = sessionStorage.getItem('decoupling_reasoning') || "DECOUPLING AUDIT PROTOCOLS SUCCESSFUL.\nSYSTEM IDENTIFIED USER SYNTAX ANOMALIES.";
                if (reasoningText) reasoningText.textContent = reasoning;
                if (reasoningBox) reasoningBox.classList.remove('hidden');
            } else {
                if (reasoningBox) reasoningBox.classList.add('hidden');
            }
        }

        async function hardResetGame() {
            if (confirm("Are you sure you want to HARD RESET everything?\nThis will clear all game state and session history, and return you to the main lobby.")) {
                try {
                    const sessionId = localStorage.getItem('wolfs_session_id');
                    if (sessionId) {
                        await fetch('/api/game/reset', {
                            method: 'POST',
                            headers: { 'x-session-id': sessionId }
                        });
                    }
                } catch (e) {
                    console.error("Failed to reset game session on server:", e);
                }
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = '/';
            }
        }

        async function replayGame() {
            try {
                const sessionId = localStorage.getItem('wolfs_session_id');
                const headers = { 'Content-Type': 'application/json' };
                if (sessionId) {
                    headers['x-session-id'] = sessionId;
                }
                await fetch('/api/game/reset', { 
                    method: 'POST',
                    headers: headers
                });
            } catch (err) {
                console.error("Error resetting game:", err);
            }
            window.location.href = '/gameplay.html';
        }

        // Initialize state check based on URL parameters (?status=win or ?status=loss)
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const initialStatus = params.get('status') || 'win';
            setUIState(initialStatus);
            
            // Allow clicking anywhere on the background to toggle state secretly for diagnostic testing and play synth audio
            document.body.addEventListener('click', (e) => {
                if (e.target.id === 'btn-replay') return;
                const nextState = currentActiveState === 'win' ? 'loss' : 'win';
                setUIState(nextState);
            });
        });
    </script>
</body>
</html>
